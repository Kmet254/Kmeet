<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Discover - M-Pesa Test</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #f7fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }

    .discover-container {
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      width: 100%;
      max-width: 450px;
      padding: 20px;
      box-sizing: border-box;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #edf2f7;
      padding-bottom: 12px;
      margin-bottom: 20px;
    }

    .title {
      margin: 0;
      font-size: 18px;
      font-weight: 700;
      color: #1a202c;
    }

    .btn-group {
      display: flex;
      gap: 8px;
    }

    .renew-btn {
      background-color: #10b981;
      color: white;
      border: none;
      padding: 8px 14px;
      font-size: 14px;
      font-weight: 700;
      border-radius: 20px;
      cursor: pointer;
      transition: background-color 0.2s ease;
    }

    .renew-btn:hover {
      background-color: #059669;
    }

    .reset-btn {
      background-color: #ef4444;
      color: white;
      border: none;
      padding: 8px 12px;
      font-size: 13px;
      font-weight: 600;
      border-radius: 20px;
      cursor: pointer;
      transition: background-color 0.2s ease;
    }

    .reset-btn:hover {
      background-color: #dc2626;
    }

    .content-body {
      display: flex;
      flex-direction: column;
      gap: 16px;
      color: #334155;
      font-size: 15px;
    }

    #payment-success-box {
      display: none;
      background-color: #ecfdf5;
      border: 1px solid #a7f3d0;
      border-radius: 16px;
      padding: 16px;
      text-align: center;
      margin-top: 10px;
    }

    .success-title {
      color: #065f46;
      font-weight: 700;
      font-size: 16px;
    }

    .success-desc {
      color: #1e293b;
      font-size: 14px;
      margin-top: 6px;
    }

    .success-badge {
      color: #047857;
      font-weight: 700;
      font-size: 15px;
      margin-top: 6px;
    }
  </style>
</head>
<body>

  <div class="discover-container">
    <div class="header">
      <h2 class="title">Discover Page</h2>
      <div class="btn-group">
        <button onclick="triggerMpesaPayment()" class="renew-btn">⚡ Renew</button>
        <button onclick="clearSavedData()" class="reset-btn" title="Clear saved data">🗑️ Reset Data</button>
      </div>
    </div>

    <div class="content-body">
      <p>Welcome to the discover feed. Click the renew button above to test your M-Pesa STK push integration.</p>

      <!-- Green Payment Status Box -->
      <div id="payment-success-box">
        <div class="success-title">✔ Package Unlocked!</div>
        <div class="success-desc">
          M-Pesa prompt sent to <strong id="mpesa-phone-display">07XXXXXXXX</strong>
        </div>
        <div class="success-badge">Added +3 Conversations (KES 49)</div>
      </div>
    </div>
  </div>

  <script>
  // Clears local browser cache / storage
  function clearSavedData() {
    localStorage.clear();
    sessionStorage.clear();
    
    const successBox = document.getElementById('payment-success-box');
    if (successBox) successBox.style.display = 'none';

    console.log("Cleared Local Storage and Session Storage.");
    alert("Saved browser data cleared successfully!");
  }

  // M-Pesa STK Push Trigger with Relative URL
  async function triggerMpesaPayment() {
    let inputPhone = prompt("Enter your Safaricom phone number:", "0723535019");

    if (!inputPhone) {
      return;
    }

    let formattedPhone = inputPhone.replace(/[^0-9]/g, '');
    if (formattedPhone.startsWith('0')) {
      formattedPhone = '254' + formattedPhone.substring(1);
    } else if (formattedPhone.startsWith('7') || formattedPhone.startsWith('1')) {
      formattedPhone = '254' + formattedPhone;
    }

    const amount = 49;

    console.log(`Sending STK Push request for phone: ${formattedPhone}`);

    try {
      // Using relative URL so it works seamlessly both locally and live on Render
      const response = await fetch('/api/stkpush', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
        },
        body: JSON.stringify({
          phone: formattedPhone,
          amount: amount
        }),
      });

      console.log("Server response status:", response.status);
      const data = await response.json();
      console.log("Server response payload:", data);

      if (response.ok && data.ResponseCode === '0') {
        const phoneDisplay = document.getElementById('mpesa-phone-display');
        if (phoneDisplay) {
          phoneDisplay.innerText = inputPhone;
        }

        const successBox = document.getElementById('payment-success-box');
        if (successBox) {
          successBox.style.display = 'block';
        }

        localStorage.setItem('lastPhone', formattedPhone);
        alert(`STK Push prompt sent to ${formattedPhone}! Check your phone for the M-Pesa PIN prompt.`);

      } else {
        alert('Payment Request Failed: ' + (data.error || data.errorMessage || 'Unable to complete request.'));
      }

    } catch (err) {
      console.error('Network / Firewall Error Details:', err);
      alert('Failed to reach server. Check your connection or server logs.');
    }
  }
  </script>

</body>
</html>
