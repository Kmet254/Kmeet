<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Discover - Kmeet</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #f7fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }

    .discover-container {
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      width: 100%;
      max-width: 450px;
      padding: 24px;
      box-sizing: border-box;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #edf2f7;
      padding-bottom: 12px;
      margin-bottom: 20px;
    }

    .title {
      margin: 0;
      font-size: 18px;
      font-weight: 700;
      color: #1a202c;
    }

    .reset-btn {
      background-color: #ef4444;
      color: white;
      border: none;
      padding: 6px 12px;
      font-size: 12px;
      font-weight: 600;
      border-radius: 20px;
      cursor: pointer;
      transition: background-color 0.2s ease;
    }

    .reset-btn:hover {
      background-color: #dc2626;
    }

    .content-body {
      display: flex;
      flex-direction: column;
      gap: 16px;
      color: #334155;
      font-size: 15px;
    }

    .profile-card {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 15px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .profile-info h3 {
      margin: 0;
      font-size: 16px;
      color: #1e293b;
    }

    .profile-info p {
      margin: 4px 0 0 0;
      font-size: 13px;
      color: #64748b;
    }

    .chat-btn {
      background-color: #e07a5f;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 20px;
      font-weight: 500;
      font-size: 13px;
      cursor: pointer;
      transition: background-color 0.2s ease;
    }

    .chat-btn:hover {
      background-color: #cf694e;
    }

    #payment-success-box {
      display: none;
      background-color: #ecfdf5;
      border: 1px solid #a7f3d0;
      border-radius: 12px;
      padding: 16px;
      text-align: center;
      margin-top: 10px;
    }

    .success-title {
      color: #065f46;
      font-weight: 700;
      font-size: 15px;
    }

    .success-desc {
      color: #1e293b;
      font-size: 13px;
      margin-top: 4px;
    }

    .success-badge {
      color: #047857;
      font-weight: 700;
      font-size: 14px;
      margin-top: 4px;
    }
  </style>
</head>
<body>

  <div class="discover-container">
    <div class="header">
      <h2 class="title">Discover Profiles</h2>
      <button onclick="clearSavedData()" class="reset-btn" title="Reset payment data">🗑️ Reset Data</button>
    </div>

    <div class="content-body">
      <p style="font-size: 13px; color: #64748b; margin: 0;">Browse profiles freely. Click chat to connect (requires KES 49 package unlock).</p>
      
      <!-- Profile 1 -->
      <div class="profile-card">
        <div class="profile-info">
          <h3>Brenda, 24</h3>
          <p>Looking for intentional courtship</p>
        </div>
        <button onclick="handleChatClick('Brenda')" class="chat-btn">💬 Chat</button>
      </div>

      <!-- Profile 2 -->
      <div class="profile-card">
        <div class="profile-info">
          <h3>Brian, 27</h3>
          <p>Faithful, ambitious & family-oriented</p>
        </div>
        <button onclick="handleChatClick('Brian')" class="chat-btn">💬 Chat</button>
      </div>

      <!-- Green Payment Status Box -->
      <div id="payment-success-box">
        <div class="success-title">✔ Package Unlocked!</div>
        <div class="success-desc">
          M-Pesa prompt sent to <strong id="mpesa-phone-display">07XXXXXXXX</strong>
        </div>
        <div class="success-badge">Added +3 Conversations (KES 49)</div>
      </div>
    </div>
  </div>

  <script>
    // Check payment status on load and show success box if previously paid
    document.addEventListener('DOMContentLoaded', () => {
      const hasPaid = localStorage.getItem('hasPaid');
      const savedPhone = localStorage.getItem('lastPhone');
      if (hasPaid === 'true' && savedPhone) {
        document.getElementById('mpesa-phone-display').innerText = savedPhone;
        document.getElementById('payment-success-box').style.display = 'block';
      }
    });

    // Clears local browser cache / storage
    function clearSavedData() {
      localStorage.clear();
      sessionStorage.clear();
      
      const successBox = document.getElementById('payment-success-box');
      if (successBox) successBox.style.display = 'none';

      alert("Payment status reset successfully!");
    }

    // Triggered when user clicks Chat on any profile
    function handleChatClick(profileName) {
      const hasPaid = localStorage.getItem('hasPaid');

      if (!hasPaid || hasPaid !== 'true') {
        alert(`To chat with ${profileName}, you need to unlock conversations. Let's process the KES 49 M-Pesa payment.`);
        triggerMpesaPayment();
      } else {
        alert(`Opening secure chat with ${profileName}...`);
      }
    }

    // M-Pesa STK Push Trigger
    async function triggerMpesaPayment() {
      let inputPhone = prompt("Enter your Safaricom phone number for STK Push:", "072335...");

      if (!inputPhone) return;

      let formattedPhone = inputPhone.replace(/[^0-9]/g, '');
      if (formattedPhone.startsWith('0')) {
        formattedPhone = '254' + formattedPhone.substring(1);
      } else if (formattedPhone.startsWith('7') || formattedPhone.startsWith('1')) {
        formattedPhone = '254' + formattedPhone;
      }

      const amount = 49;

      try {
        const response = await fetch('/api/stkpush', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({
            phone: formattedPhone,
            amount: amount
          }),
        });

        const data = await response.json();

        if (response.ok && data.ResponseCode === '0') {
          document.getElementById('mpesa-phone-display').innerText = inputPhone;
          document.getElementById('payment-success-box').style.display = 'block';

          localStorage.setItem('hasPaid', 'true');
          localStorage.setItem('lastPhone', inputPhone);

          alert(`STK Push prompt sent to ${formattedPhone}! Check your phone to complete payment.`);

        } else {
          alert('Payment Request Failed: ' + (data.error || data.errorMessage || 'Unable to complete request.'));
        }

      } catch (err) {
        console.error('Network Error:', err);
        alert('Failed to reach server. Check your connection.');
      }
    }
  </script>

</body>
</html>
