<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Discover - Kmeet</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #f7fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }

    .discover-container {
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      width: 100%;
      max-width: 500px;
      padding: 24px;
      box-sizing: border-box;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #edf2f7;
      padding-bottom: 12px;
      margin-bottom: 16px;
    }

    .title {
      margin: 0;
      font-size: 18px;
      font-weight: 700;
      color: #1a202c;
    }

    .reset-btn {
      background-color: #ef4444;
      color: white;
      border: none;
      padding: 6px 12px;
      font-size: 12px;
      font-weight: 600;
      border-radius: 20px;
      cursor: pointer;
      transition: background-color 0.2s ease;
    }

    .reset-btn:hover {
      background-color: #dc2626;
    }

    /* Scrollable Profile List Container */
    .profiles-scroll {
      max-height: 420px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding-right: 4px;
    }

    .profile-card {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .profile-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .avatar-wrapper {
      position: relative;
    }

    .profile-avatar {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid #e2e8f0;
    }

    .online-indicator {
      position: absolute;
      bottom: 2px;
      right: 2px;
      width: 12px;
      height: 12px;
      background-color: #10b981;
      border: 2px solid #ffffff;
      border-radius: 50%;
    }

    .profile-info h3 {
      margin: 0;
      font-size: 15px;
      color: #1e293b;
    }

    .profile-info p {
      margin: 3px 0 0 0;
      font-size: 12px;
      color: #64748b;
    }

    .chat-btn {
      background-color: #e07a5f;
      color: white;
      border: none;
      padding: 8px 14px;
      border-radius: 20px;
      font-weight: 500;
      font-size: 13px;
      cursor: pointer;
      transition: background-color 0.2s ease;
      white-space: nowrap;
    }

    .chat-btn:hover {
      background-color: #cf694e;
    }

    #payment-success-box {
      display: none;
      background-color: #ecfdf5;
      border: 1px solid #a7f3d0;
      border-radius: 12px;
      padding: 14px;
      text-align: center;
      margin-top: 14px;
    }

    .success-title {
      color: #065f46;
      font-weight: 700;
      font-size: 14px;
    }

    .success-desc {
      color: #1e293b;
      font-size: 12px;
      margin-top: 3px;
    }

    .success-badge {
      color: #047857;
      font-weight: 700;
      font-size: 13px;
      margin-top: 3px;
    }
  </style>
</head>
<body>

  <div class="discover-container">
    <div class="header">
      <h2 class="title">Discover Profiles (<span id="profile-count">0</span> Online)</h2>
      <button onclick="clearSavedData()" class="reset-btn" title="Reset payment data">🗑️ Reset Data</button>
    </div>

    <p style="font-size: 13px; color: #64748b; margin: 0 0 12px 0;">Browse active local members. Clicking chat requires KES 49 conversation unlock.</p>

    <!-- Dynamic Profiles List -->
    <div class="profiles-scroll" id="profilesContainer">
      <!-- Profiles rendered via JavaScript -->
    </div>

    <!-- Green Payment Status Box -->
    <div id="payment-success-box">
      <div class="success-title">✔ Package Unlocked!</div>
      <div class="success-desc">
        M-Pesa prompt sent to <strong id="mpesa-phone-display">07XXXXXXXX</strong>
      </div>
      <div class="success-badge">Added +3 Conversations (KES 49)</div>
    </div>
  </div>

  <script>
    // Your list of local profiles
    const profiles = [
      { name: "Brenda, 24", bio: "Intentional courtship", avatar: "https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150&auto=format&fit=crop&q=80" },
      { name: "Brian, 27", bio: "Family-oriented & faithful", avatar: "https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=150&auto=format&fit=crop&q=80" },
      { name: "Amina, 23", bio: "Deep conversations & growth", avatar: "https://images.unsplash.com/photo-1517841905240-472988babdf9?w=150&auto=format&fit=crop&q=80" },
      { name: "Kevin, 26", bio: "Looking for a true partner", avatar: "https://images.unsplash.com/photo-1500648767791-00dcc994a43e?w=150&auto=format&fit=crop&q=80" },
      { name: "Sharon, 25", bio: "Faith, family & future", avatar: "https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=150&auto=format&fit=crop&q=80" },
      { name: "David, 28", bio: "Builder, reader & believer", avatar: "https://images.unsplash.com/photo-1492562080023-ab3db95bfbce?w=150&auto=format&fit=crop&q=80" },
      { name: "Mercy, 22", bio: "Kind-hearted and joyful", avatar: "https://images.unsplash.com/photo-1524504388940-b1c1722653e1?w=150&auto=format&fit=crop&q=80" },
      { name: "Daniel, 29", bio: "Seeking meaningful connection", avatar: "https://images.unsplash.com/photo-1522075469751-3a6694fb2f61?w=150&auto=format&fit=crop&q=80" },
      { name: "Faith, 24", bio: "Loves nature and deep talks", avatar: "https://images.unsplash.com/photo-1531746020798-e6953c6e8e04?w=150&auto=format&fit=crop&q=80" },
      { name: "Victor, 27", bio: "Driven, honest & warm", avatar: "https://images.unsplash.com/photo-1506794778202-cad84cf45f1d?w=150&auto=format&fit=crop&q=80" },
      { name: "Joy, 23", bio: "Positive energy & purpose", avatar: "https://images.unsplash.com/photo-1529626455594-4ff0802cfb7e?w=150&auto=format&fit=crop&q=80" },
      { name: "Emmanuel, 26", bio: "Christ-centered relationship", avatar: "https://images.unsplash.com/photo-1519085360753-af0119f7cbe7?w=150&auto=format&fit=crop&q=80" },
      { name: "Cynthia, 25", bio: "Creative soul and listener", avatar: "https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150&auto=format&fit=crop&q=80" },
      { name: "Ian, 28", bio: "Loyal and growth-focused", avatar: "https://images.unsplash.com/photo-1472099645785-5658abf4ff4e?w=150&auto=format&fit=crop&q=80" },
      { name: "Esther, 24", bio: "Family values & laughter", avatar: "https://images.unsplash.com/photo-1544005313-94ddf0286df2?w=150&auto=format&fit=crop&q=80" },
      { name: "Collins, 27", bio: "Calm, focused & caring", avatar: "https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=150&auto=format&fit=crop&q=80" },
      { name: "Rachel, 26", bio: "Intentional and genuine", avatar: "https://images.unsplash.com/photo-1517841905240-472988babdf9?w=150&auto=format&fit=crop&q=80" },
      { name: "Baraka, 29", bio: "Hardworking & romantic", avatar: "https://images.unsplash.com/photo-1500648767791-00dcc994a43e?w=150&auto=format&fit=crop&q=80" },
      { name: "Vivian, 23", bio: "Kindness and ambition", avatar: "https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=150&auto=format&fit=crop&q=80" },
      { name: "Dennis, 28", bio: "Ready for marriage journey", avatar: "https://images.unsplash.com/photo-1492562080023-ab3db95bfbce?w=150&auto=format&fit=crop&q=80" }
    ];

    document.addEventListener('DOMContentLoaded', () => {
      // Render profile cards dynamically
      const container = document.getElementById('profilesContainer');
      document.getElementById('profile-count').innerText = profiles.length;

      container.innerHTML = profiles.map(p => `
        <div class="profile-card">
          <div class="profile-left">
            <div class="avatar-wrapper">
              <img src="${p.avatar}" alt="${p.name}" class="profile-avatar">
              <span class="online-indicator"></span>
            </div>
            <div class="profile-info">
              <h3>${p.name}</h3>
              <p>${p.bio}</p>
            </div>
          </div>
          <button onclick="handleChatClick('${p.name.split(',')[0]}')" class="chat-btn">💬 Chat</button>
        </div>
      `).join('');

      // Check payment status on load
      const hasPaid = localStorage.getItem('hasPaid');
      const savedPhone = localStorage.getItem('lastPhone');
      if (hasPaid === 'true' && savedPhone) {
        document.getElementById('mpesa-phone-display').innerText = savedPhone;
        document.getElementById('payment-success-box').style.display = 'block';
      }
    });

    // Clears local browser cache / storage
    function clearSavedData() {
      localStorage.clear();
      sessionStorage.clear();
      
      const successBox = document.getElementById('payment-success-box');
      if (successBox) successBox.style.display = 'none';

      alert("Payment status reset successfully!");
    }

    // Triggered when user clicks Chat on any profile
    function handleChatClick(profileName) {
      const hasPaid = localStorage.getItem('hasPaid');

      if (!hasPaid || hasPaid !== 'true') {
        alert(`To chat with ${profileName}, you need to unlock conversations. Let's process the KES 49 M-Pesa payment.`);
        triggerMpesaPayment();
      } else {
        alert(`Opening secure chat with ${profileName}...`);
      }
    }

    // M-Pesa STK Push Trigger
    async function triggerMpesaPayment() {
      let inputPhone = prompt("Enter your Safaricom phone number for STK Push:", "072335...");

      if (!inputPhone) return;

      let formattedPhone = inputPhone.replace(/[^0-9]/g, '');
      if (formattedPhone.startsWith('0')) {
        formattedPhone = '254' + formattedPhone.substring(1);
      } else if (formattedPhone.startsWith('7') || formattedPhone.startsWith('1')) {
        formattedPhone = '254' + formattedPhone;
      }

      const amount = 49;

      try {
        const response = aliasFetch('/api/stkpush', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ phone: formattedPhone, amount: amount })
        }); // standard fetch call below

        const fetchResp = await fetch('/api/stkpush', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ phone: formattedPhone, amount: amount }),
        });

        const data = await fetchResp.json();

        if (fetchResp.ok && data.ResponseCode === '0') {
          document.getElementById('mpesa-phone-display').innerText = inputPhone;
          document.getElementById('payment-success-box').style.display = 'block';

          localStorage.setItem('hasPaid', 'true');
          localStorage.setItem('lastPhone', inputPhone);

          alert(`STK Push prompt sent to ${formattedPhone}! Check your phone to complete payment.`);

        } else {
          alert('Payment Request Failed: ' + (data.error || data.errorMessage || 'Unable to complete request.'));
        }

      } catch (err) {
        console.error('Network Error:', err);
        alert('Failed to reach server. Check your connection.');
      }
    }
  </script>

</body>
</html>
