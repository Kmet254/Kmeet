<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discover Matches - Kmeet</title>

    <!-- Browser Tab Icon -->
    <link rel="icon" type="image/png" href="/heart.png.png">
    <base target="_self">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: #0d0b0e;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background: linear-gradient(rgba(13, 11, 14, 0.55), rgba(4, 9, 30, 0.75)), url('img/bg34.jpg') no-repeat center center fixed;
            background-size: cover;
        }

        /* Top Navigation */
        .main-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            padding: 16px 24px;
            background: rgba(13, 11, 14, 0.8);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .logo img {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid rgba(224, 122, 95, 0.5);
            display: block;
        }

        .nav-links ul {
            display: flex;
            list-style: none;
            gap: 20px;
            align-items: center;
        }

        .nav-links ul li a {
            color: #ffffff;
            text-decoration: none;
            font-size: 13px;
            letter-spacing: 1px;
            transition: color 0.2s ease;
        }

        .nav-links a:hover {
            color: #e07a5f;
        }

        /* Quota Banner */
        .quota-banner {
            background: rgba(224, 122, 95, 0.2);
            border: 1px solid #e07a5f;
            max-width: 1200px;
            margin: 20px auto 0 auto;
            width: calc(100% - 40px);
            padding: 12px 20px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
        }

        .quota-banner span {
            font-weight: 600;
            color: #fceee9;
        }

        .btn-top-up {
            background: #e07a5f;
            color: white;
            border: none;
            padding: 6px 14px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 500;
        }

        .btn-top-up:hover {
            opacity: 0.9;
        }

        /* Discover Layout Container */
        .discover-container {
            max-width: 1200px;
            width: 100%;
            margin: 20px auto;
            padding: 0 20px;
            flex: 1;
        }

        .discover-container h2 {
            font-size: 24px;
            color: #fceee9;
            margin-bottom: 6px;
        }

        .discover-container p.subtitle {
            font-size: 13px;
            color: #d1cdca;
            margin-bottom: 25px;
        }

        /* Matches Grid */
        .matches-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 20px;
            padding-bottom: 80px;
            width: 100%;
        }

        .match-card {
            background: #ffffff;
            color: #333333;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .card-img-container {
            width: 100%;
            height: 240px;
            position: relative;
            background: #eaeaea;
        }

        .card-img-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .online-badge {
            position: absolute;
            top: 10px;
            right: 10px;
            background: #2ecc71;
            color: white;
            font-size: 10px;
            font-weight: 600;
            padding: 3px 8px;
            border-radius: 12px;
            letter-spacing: 0.5px;
        }

        .card-body {
            padding: 14px;
            display: flex;
            flex-direction: column;
            flex: 1;
        }

        .card-body h3 {
            font-size: 16px;
            color: #111;
            margin-bottom: 4px;
        }

        .card-body .location {
            font-size: 12px;
            color: #666;
            margin-bottom: 6px;
        }

        .card-body .bio {
            font-size: 12px;
            color: #444;
            margin-bottom: 14px;
            flex: 1;
        }

        .card-actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 8px;
        }

        .btn-action {
            padding: 8px;
            border: none;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            text-align: center;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            text-decoration: none;
        }

        .btn-say-hi {
            background-color: #007bff;
            color: white;
        }

        .btn-say-hello {
            background-color: #6c757d;
            color: white;
        }

        .btn-view-profile {
            background-color: #17a2b8;
            color: white;
            width: 100%;
        }

        .btn-action:hover {
            opacity: 0.85;
        }
    </style>
</head>
<body>

    <!-- Navigation Header -->

        <div class="nav-links">
            <ul>

            { id: 31, name: 'Tony, 29', location: 'Machakos', bio: 'Musician and sound engineer looking for creative synergy and sincere love.', img: 'https://images.unsplash.com/photo-1506794778202-cad84cf45f1d?w=300&auto=format&fit=crop&q=80', online: true },

            { id: 33, name: 'Moses, 32', location: 'Kisumu', bio: 'University lecturer seeking an intellectual connection and lifelong partnership.', img: 'https://images.unsplash.com/photo-1519085360753-af0119f7cbe7?w=300&auto=format&fit=crop&q=80', online: true },
            { id: 34, name: 'Pamela, 26', location: 'Mombasa', bio: 'Tour consultant who loves exploring wildlife parks, camping, and meeting new people.', img: 'https://images.unsplash.com/photo-1529626455594-4ff0802cfb7e?w=300&auto=format&fit=crop&q=80', online: false },
            { id: 35, name: 'Steven, 28', location: 'Nakuru', bio: 'Real estate agent ready to build a lasting future and a warm, loving home.', img: 'https://images.unsplash.com/photo-1501196354995-cbb51c65aaea?w=300&auto=format&fit=crop&q=80', online: true }

        function renderProfiles() {
            const grid = document.getElementById('matchesGrid');
            grid.innerHTML = profiles.map(p => `
                <div class="match-card">
                    <div class="card-img-container">
                        <img src="${p.img}" alt="${p.name}">
                        ${p.online ? '<span class="online-badge">ONLINE</span>' : ''}
                    </div>
                    <div class="card-body">
                        <h3>${p.name}</h3>
                        <div class="location"><i class="fa-solid fa-location-dot"></i> ${p.location}</div>
                        <div class="bio">${p.bio}</div>
                        <div class="card-actions">
                            <button onclick="openIntroChat('${p.name}', 'Hi')" class="btn-action btn-say-hi">
                                <i class="fa-solid fa-hand"></i> Say Hi
                            </button>
                            <button onclick="openIntroChat('${p.name}', 'Hey')" class="btn-action btn-say-hello">
                                <i class="fa-solid fa-hands-clapping"></i> Hello
                            </button>
                        </div>
                        <button onclick="viewProfile(${p.id})" class="btn-action btn-view-profile">
                            <i class="fa-solid fa-user"></i> View Profile
                        </button>
                    </div>
                </div>
            `).join('');
            
            updateQuotaDisplay();
        }

        function updateQuotaDisplay() {
            const quota = localStorage.getItem('chatQuota') || '0';
            document.getElementById('quotaDisplay').innerText = `${quota} chats remaining`;
        }

        function checkAuthAndProceed() {
            const isLoggedIn = localStorage.getItem('isLoggedIn') === 'true';
            if (!isLoggedIn) {
                alert("Please create an account or log in to interact with profiles!");
                localStorage.setItem('redirectAfterAuth', 'discover.html');
                window.location.href = 'myweb.html';
                return false;
            }
            return true;
        }

        function viewProfile(profileId) {
            const profile = profiles.find(p => p.id === profileId);
            if (profile) {
                localStorage.setItem('viewedProfile', JSON.stringify(profile));
                window.location.href = 'profile.html';
            }
        }

        // Opens the restricted free Intro Chat popup modal
        function openIntroChat(recipientName, greetingText) {
            if (!checkAuthAndProceed()) return;

            let existingModal = document.getElementById('introChatModal');
            if (existingModal) existingModal.remove();

            const modalHTML = `
                <div id="introChatModal" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: flex; align-items: center; justify-content: center; z-index: 1000; backdrop-filter: blur(5px);">
                    <div style="background: #17141a; border: 1px solid rgba(255,255,255,0.15); border-radius: 16px; padding: 25px; max-width: 420px; width: 90%; text-align: left; box-shadow: 0 10px 30px rgba(0,0,0,0.8);">
                        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                            <h3 style="color: #fceee9; font-size: 18px;">Chat with ${recipientName}</h3>
                            <button onclick="document.getElementById('introChatModal').remove()" style="background:none; border:none; color:#aaa; font-size:16px; cursor:pointer;"><i class="fa-solid fa-xmark"></i></button>
                        </div>
                        
                        <div style="background: rgba(255,255,255,0.05); border-radius: 10px; padding: 12px; margin-bottom: 15px; max-height: 180px; overflow-y: auto;">
                            <div style="font-size: 11px; color: #a09a9f; text-align: center; margin-bottom: 8px;">Free Intro Session Active (Restricted to Hi/Hey)</div>
                            <div style="background: #e07a5f; color: white; padding: 8px 12px; border-radius: 8px; font-size: 13px; max-width: 80%; margin-left: auto; margin-bottom: 8px;">
                                ${greetingText}
                            </div>
                            <div style="background: #2a262f; color: #fceee9; padding: 8px 12px; border-radius: 8px; font-size: 13px; max-width: 80%;">
                                Hello there! Thanks for reaching out. 😊
                            </div>
                        </div>

                        <p style="font-size: 12px; color: #d1cdca; margin-bottom: 15px; text-align: center;">
                            Want to send more messages or continue the conversation? Top up a bundle!
                        </p>

                        <div style="display: flex; gap: 10px;">
                            <button onclick="document.getElementById('introChatModal').remove(); window.location.href='discover.html';" style="flex: 1; background: transparent; border: 1px solid rgba(255,255,255,0.2); color: #ccc; padding: 10px; border-radius: 8px; font-size: 13px; cursor: pointer;">Back to Discover</button>
                            <button onclick="document.getElementById('introChatModal').remove(); showSenderBundleModal('${recipientName}');" style="flex: 1; background: #e07a5f; border: none; color: white; padding: 10px; border-radius: 8px; font-size: 13px; font-weight: 500; cursor: pointer;">Add More Chats</button>
                        </div>
                    </div>
                </div>
            `;
            document.body.insertAdjacentHTML('beforeend', modalHTML);
        }

        function forceOpenBundleModal() {
            if (!checkAuthAndProceed()) return;
            showSenderBundleModal('a member');
        }

        function showSenderBundleModal(recipientName) {
            localStorage.setItem('chatRecipient', recipientName);
            
            let existingModal = document.getElementById('senderBundleModal');
            if (existingModal) existingModal.remove();

            const modalHTML = `
                <div id="senderBundleModal" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); display: flex; align-items: center; justify-content: center; z-index: 1000; backdrop-filter: blur(5px);">
                    <div style="background: #17141a; border: 1px solid rgba(255,255,255,0.15); border-radius: 16px; padding: 30px; max-width: 400px; width: 90%; text-align: left; box-shadow: 0 10px 30px rgba(0,0,0,0.6);">
                        <h3 style="color: #fceee9; font-size: 20px; margin-bottom: 8px;">Choose Your Chat Bundle</h3>
                        <p style="color: #d1cdca; font-size: 13px; margin-bottom: 20px;">You need an active chat pass to unlock extended messaging. Select a package below:</p>
                        
                        <div onclick="selectSenderTier('49')" style="background: rgba(224,122,95,0.1); border: 1px solid #e07a5f; border-radius: 10px; padding: 15px; margin-bottom: 12px; cursor: pointer;">
                            <div style="font-weight: 600; color: #fceee9; font-size: 15px;">Starter Package (KES 49)</div>
                            <div style="font-size: 12px; color: #d1cdca;">Get 3 chats to continue conversation.</div>
                        </div>

                        <div onclick="selectSenderTier('100')" style="background: rgba(46,204,113,0.1); border: 1px solid #2ecc71; border-radius: 10px; padding: 15px; margin-bottom: 20px; cursor: pointer;">
                            <div style="font-weight: 600; color: #fceee9; font-size: 15px;">Bonus VIP Package (KES 100)</div>
                            <div style="font-size: 12px; color: #d1cdca;">Get 8 extended chats to reach multiple members.</div>
                        </div>

                        <button onclick="closeBundleModalAndStay()" style="background: transparent; border: none; color: #a09a9f; font-size: 13px; cursor: pointer; width: 100%; text-align: center;">Cancel</button>
                    </div>
                </div>
            `;
            document.body.insertAdjacentHTML('beforeend', modalHTML);
        }

        function closeBundleModalAndStay() {
            const modal = document.getElementById('senderBundleModal');
            if (modal) modal.remove();
            window.location.href = 'discover.html';
        }

        function selectSenderTier(tier) {
            localStorage.setItem('activePaymentTier', tier);
            window.location.href = 'pay-fee.html';
        }

        document.addEventListener('DOMContentLoaded', renderProfiles);
    </script>
</body>
</html>
