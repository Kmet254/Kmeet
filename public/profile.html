<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile - Kmeet</title>

    <!-- Browser Tab Icon -->
    <link rel="icon" type="image/png" href="/heart.png.png">
    <base target="_self">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;1,400&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: #0d0b0e;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: linear-gradient(rgba(13, 11, 14, 0.55), rgba(4, 9, 30, 0.75)), url('img/bg34.jpg') no-repeat center center fixed;
            background-size: cover;
            padding: 20px;
        }

        .profile-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            width: 100%;
            max-width: 440px;
            padding: 36px 28px;
            text-align: center;
        }

        .profile-avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #e07a5f;
            margin-bottom: 16px;
        }

        h2 {
            font-size: 22px;
            font-weight: 600;
            color: #fceee9;
            margin-bottom: 8px;
        }

        .profile-email {
            font-size: 13px;
            color: #d1cdca;
            margin-bottom: 20px;
        }

        .interests-container {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            justify-content: center;
            margin-bottom: 24px;
        }

        .tag {
            background: rgba(224, 122, 95, 0.2);
            color: #fceee9;
            font-size: 11px;
            padding: 4px 10px;
            border-radius: 12px;
            border: 1px solid rgba(224, 122, 95, 0.4);
        }

        /* Action Buttons Grid */
        .profile-actions {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
        }

        .btn-group-row {
            display: flex;
            gap: 10px;
            width: 100%;
        }

        .btn-primary {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 25px;
            background-color: #e07a5f;
            color: #ffffff;
            font-size: 14px;
            font-weight: 500;
            text-decoration: none;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: background 0.3s ease;
        }

        .btn-primary:hover {
            background-color: #d0694e;
        }

        .btn-secondary {
            flex: 1;
            padding: 12px;
            border-radius: 25px;
            background: rgba(255, 255, 255, 0.1);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.2);
            font-size: 14px;
            font-weight: 500;
            text-decoration: none;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: background 0.3s ease;
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .btn-logout {
            background: none;
            border: none;
            color: #b5ada7;
            font-size: 13px;
            cursor: pointer;
            margin-top: 15px;
            text-decoration: underline;
        }

        .btn-logout:hover {
            color: #ffffff;
        }
    </style>
</head>
<body>

    <div class="profile-card">
        <img id="profileAvatar" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=300&auto=format&fit=crop&q=80" alt="Profile Avatar" class="profile-avatar">
        
        <h2 id="profileName">My Profile</h2>
        <p id="profileEmail" class="profile-email">Loading email...</p>

        <div class="interests-container" id="profileInterests">
            <!-- Dynamic Interests Tags will load here -->
        </div>

        <div class="profile-actions">
            <!-- Row holding Discover and Home buttons -->
            <div class="btn-group-row">
                <a href="discover.html" class="btn-primary">
                    <i class="fa-solid fa-compass"></i> Discover
                </a>
                <a href="myweb.html" class="btn-secondary">
                    <i class="fa-solid fa-house"></i> Home
                </a>
            </div>

            <!-- Log Out Action -->
            <button id="logoutBtn" class="btn-logout">Log Out</button>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Fetch local session details
            const savedEmail = localStorage.getItem('userEmail');
            const savedName = localStorage.getItem('userName');
            const savedAvatar = localStorage.getItem('userAvatar');
            const savedInterests = JSON.parse(localStorage.getItem('userInterests')) || [];

            if (savedEmail) {
                document.getElementById('profileEmail').textContent = savedEmail;
            }

            if (savedName) {
                document.getElementById('profileName').textContent = savedName;
            } else if (savedEmail) {
                const derivedName = savedEmail.split('@')[0];
                document.getElementById('profileName').textContent = derivedName.charAt(0).toUpperCase() + derivedName.slice(1);
            }

            if (savedAvatar) {
                document.getElementById('profileAvatar').src = savedAvatar;
            }

            const interestsContainer = document.getElementById('profileInterests');
            if (savedInterests.length > 0) {
                interestsContainer.innerHTML = savedInterests.map(tag => `<span class="tag">${tag}</span>`).join('');
            } else {
                interestsContainer.innerHTML = `<span style="font-size: 12px; color: #9a9499;">No interests added yet.</span>`;
            }

            // Handle Logout
            const logoutBtn = document.getElementById('logoutBtn');
            if (logoutBtn) {
                logoutBtn.addEventListener('click', function() {
                    localStorage.clear();
                    window.location.href = 'myweb.html';
                });
            }
        });
    </script>
</body>
</html>
