<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile - Kmeet</title>

    <!-- Browser Tab Icon -->
    <link rel="icon" type="image/png" href="/heart.png.png">
    <base target="_self">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: #0d0b0e;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background: linear-gradient(rgba(13, 11, 14, 0.55), rgba(4, 9, 30, 0.75)), url('img/bg34.jpg') no-repeat center center fixed;
            background-size: cover;
        }

        /* Top Navigation */
        .main-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            padding: 16px 24px;
            background: rgba(13, 11, 14, 0.8);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .logo img {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid rgba(224, 122, 95, 0.5);
            display: block;
        }

        .nav-links ul {
            display: flex;
            list-style: none;
            gap: 20px;
            align-items: center;
        }

        .nav-links ul li a {
            color: #ffffff;
            text-decoration: none;
            font-size: 13px;
            letter-spacing: 1px;
            transition: color 0.2s ease;
        }

        .nav-links a:hover {
            color: #e07a5f;
        }

        /* Profile Layout Container */
        .profile-container {
            max-width: 800px;
            width: 100%;
            margin: 40px auto;
            padding: 0 20px;
            flex: 1;
        }

        .profile-card {
            background: rgba(23, 20, 26, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 16px;
            padding: 30px;
            backdrop-filter: blur(10px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .avatar-container {
            position: relative;
            width: 130px;
            height: 130px;
            margin-bottom: 20px;
        }

        .avatar-container img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #e07a5f;
        }

        .upload-btn-label {
            position: absolute;
            bottom: 0;
            right: 0;
            background: #e07a5f;
            color: white;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            transition: opacity 0.2s;
        }

        .upload-btn-label:hover {
            opacity: 0.9;
        }

        #profileImageInput {
            display: none;
        }

        .profile-name {
            font-size: 22px;
            color: #fceee9;
            margin-bottom: 6px;
        }

        .profile-meta {
            font-size: 13px;
            color: #d1cdca;
            margin-bottom: 20px;
        }

        .profile-bio {
            font-size: 14px;
            color: #bbb;
            max-width: 500px;
            margin-bottom: 20px;
            line-height: 1.5;
        }

        .subscription-box {
            background: rgba(224, 122, 95, 0.1);
            border: 1px solid #e07a5f;
            border-radius: 12px;
            padding: 15px 25px;
            width: 100%;
            max-width: 500px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            font-size: 13px;
        }

        .subscription-box span {
            font-weight: 600;
            color: #fceee9;
        }

        .btn-top-up {
            background: #e07a5f;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 500;
        }

        .btn-top-up:hover {
            opacity: 0.9;
        }

        .action-buttons {
            display: flex;
            gap: 10px;
            width: 100%;
            max-width: 500px;
            margin-bottom: 10px;
        }

        .action-buttons-row2 {
            display: flex;
            gap: 10px;
            width: 100%;
            max-width: 500px;
        }

        .btn-main {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .btn-discover {
            background: #2a262f;
            color: #fceee9;
            border: 1px solid rgba(255,255,255,0.2);
        }

        .btn-edit {
            background: #e07a5f;
            color: white;
        }

        .btn-logout {
            background: #c0392b;
            color: white;
        }

        .btn-main:hover {
            opacity: 0.85;
        }
    </style>
</head>
<body>

    <!-- Navigation Header -->
    <nav class="main-nav">
        <div class="logo">
            <a href="myweb.html" onclick="localStorage.removeItem('viewedProfile')">
                <img src="/Kmeet.jpg_2.jfif" alt="Kmeet Logo">
            </a>
        </div>
        <div class="nav-links">
            <ul>
                <li><a href="discover.html" onclick="localStorage.removeItem('viewedProfile')">DISCOVER</a></li>
                <li><a href="profile.html" style="color: #e07a5f;" onclick="localStorage.removeItem('viewedProfile')">PROFILE</a></li>
                <li><a href="myweb.html" onclick="localStorage.removeItem('viewedProfile')">HOME</a></li>
            </ul>
        </div>
    </nav>

    <!-- Main Profile Container -->
    <div class="profile-container">
        <div class="profile-card" id="profileCardContent">
            <!-- Dynamically populated profile info -->
        </div>
    </div>

    <script>
        function checkAuth() {
            const isLoggedIn = localStorage.getItem('isLoggedIn') === 'true';
            if (!isLoggedIn) {
                alert("Please log in to view your profile.");
                window.location.href = 'myweb.html';
                return false;
            }
            return true;
        }

        function renderProfileData() {
            if (!checkAuth()) return;

            const viewedProfileStr = localStorage.getItem('viewedProfile');
            let profileData;

            if (viewedProfileStr) {
                profileData = JSON.parse(viewedProfileStr);
            } else {
                profileData = {
                    name: localStorage.getItem('userName') || 'Kmeet Member',
                    location: localStorage.getItem('userLocation') || 'Kenya',
                    bio: localStorage.getItem('userBio') || 'Looking for a genuine, respectful connection that could lead to something wonderful and lasting.',
                    img: localStorage.getItem('userProfilePic') || 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=300&auto=format&fit=crop&q=80',
                    isOwnProfile: true
                };
            }

            const quota = localStorage.getItem('chatQuota') || '0';

            const card = document.getElementById('profileCardContent');
            card.innerHTML = `
                <div class="avatar-container">
                    <img id="userAvatar" src="${profileData.img}" alt="Profile Picture">
                    ${profileData.isOwnProfile ? `
                        <label for="profileImageInput" class="upload-btn-label" title="Upload low-MB profile photo">
                            <i class="fa-solid fa-camera"></i>
                        </label>
                        <input type="file" id="profileImageInput" accept="image/*" onchange="compressAndUploadPic(event)">
                    ` : ''}
                </div>

                <h2 class="profile-name">${profileData.name}</h2>
                <div class="profile-meta"><i class="fa-solid fa-location-dot"></i> ${profileData.location}</div>
                <div class="profile-bio">${profileData.bio}</div>

                ${profileData.isOwnProfile ? `
                    <div class="subscription-box">
                        <div>Chat Pass Quota: <span id="profileQuotaDisplay">${quota} chats remaining</span></div>
                        <button class="btn-top-up" onclick="window.location.href='pay-fee.html'">Top Up</button>
                    </div>

                    <div class="action-buttons">
                        <button onclick="openEditBioModal()" class="btn-main btn-edit">
                            <i class="fa-solid fa-pen-to-square"></i> Edit Profile
                        </button>
                        <a href="discover.html" class="btn-main btn-discover" onclick="localStorage.removeItem('viewedProfile')">
                            <i class="fa-solid fa-compass"></i> Discover
                        </a>
                    </div>
                    <div class="action-buttons-row2">
                        <button onclick="logoutUser()" class="btn-main btn-logout">
                            <i class="fa-solid fa-right-from-bracket"></i> Log Out
                        </button>
                    </div>
                ` : `
                    <div class="action-buttons">
                        <a href="discover.html" class="btn-main btn-discover" onclick="localStorage.removeItem('viewedProfile')">
                            <i class="fa-solid fa-arrow-left"></i> Back to Discover
                        </a>
                    </div>
                `}
            `;
        }

        // Open Edit Bio & Name Modal Popup
        function openEditBioModal() {
            const currentName = localStorage.getItem('userName') || 'Kmeet Member';
            const currentBio = localStorage.getItem('userBio') || 'Looking for a genuine, respectful connection that could lead to something wonderful and lasting.';

            let existingModal = document.getElementById('editBioModal');
            if (existingModal) existingModal.remove();

            const modalHTML = `
                <div id="editBioModal" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: flex; align-items: center; justify-content: center; z-index: 1000; backdrop-filter: blur(5px);">
                    <div style="background: #17141a; border: 1px solid rgba(255,255,255,0.15); border-radius: 16px; padding: 25px; max-width: 420px; width: 90%; text-align: left; box-shadow: 0 10px 30px rgba(0,0,0,0.8);">
                        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                            <h3 style="color: #fceee9; font-size: 18px;">Edit Your Profile</h3>
                            <button onclick="document.getElementById('editBioModal').remove()" style="background:none; border:none; color:#aaa; font-size:16px; cursor:pointer;"><i class="fa-solid fa-xmark"></i></button>
                        </div>
                        
                        <div style="margin-bottom: 12px;">
                            <label style="font-size: 12px; color: #d1cdca; display: block; margin-bottom: 4px;">Display Name</label>
                            <input type="text" id="editNameInput" value="${currentName}" style="width: 100%; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.2); border-radius: 8px; padding: 10px; color: white; font-family: 'Poppins', sans-serif; font-size: 13px;">
                        </div>

                        <div style="margin-bottom: 20px;">
                            <label style="font-size: 12px; color: #d1cdca; display: block; margin-bottom: 4px;">Your Bio / About Me</label>
                            <textarea id="editBioInput" rows="4" style="width: 100%; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.2); border-radius: 8px; padding: 10px; color: white; font-family: 'Poppins', sans-serif; font-size: 13px; resize: none;">${currentBio}</textarea>
                        </div>

                        <div style="display: flex; gap: 10px;">
                            <button onclick="document.getElementById('editBioModal').remove()" style="flex: 1; background: transparent; border: 1px solid rgba(255,255,255,0.2); color: #ccc; padding: 10px; border-radius: 8px; font-size: 13px; cursor: pointer;">Cancel</button>
                            <button onclick="saveProfileBioChanges()" style="flex: 1; background: #e07a5f; border: none; color: white; padding: 10px; border-radius: 8px; font-size: 13px; font-weight: 500; cursor: pointer;">Save Changes</button>
                        </div>
                    </div>
                </div>
            `;
            document.body.insertAdjacentHTML('beforeend', modalHTML);
        }

        function saveProfileBioChanges() {
            const newName = document.getElementById('editNameInput').value.trim();
            const newBio = document.getElementById('editBioInput').value.trim();

            if (!newName) {
                alert("Name cannot be empty!");
                return;
            }

            localStorage.setItem('userName', newName);
            localStorage.setItem('userBio', newBio || 'Looking for a genuine, respectful connection.');

            document.getElementById('editBioModal').remove();
            renderProfileData();
            alert("Profile successfully updated!");
        }

        // Automatic image compression function to keep file size low (under 1 MB)
        function compressAndUploadPic(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = function (e) {
                const img = new Image();
                img.src = e.target.result;
                img.onload = function () {
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');

                    const MAX_WIDTH = 400;
                    const MAX_HEIGHT = 400;
                    let width = img.width;
                    let height = img.height;

                    if (width > height) {
                        if (width > MAX_WIDTH) {
                            height *= MAX_WIDTH / width;
                            width = MAX_WIDTH;
                        }
                    } else {
                        if (height > MAX_HEIGHT) {
                            width *= MAX_HEIGHT / height;
                            height = MAX_HEIGHT;
                        }
                    }

                    canvas.width = width;
                    canvas.height = height;
                    ctx.drawImage(img, 0, 0, width, height);

                    const compressedDataUrl = canvas.toDataURL('image/jpeg', 0.7);

                    localStorage.setItem('userProfilePic', compressedDataUrl);
                    document.getElementById('userAvatar').src = compressedDataUrl;
                    alert("Profile picture successfully compressed and updated!");
                };
            };
        }

        function logoutUser() {
            if (confirm("Are you sure you want to log out?")) {
                localStorage.removeItem('isLoggedIn');
                localStorage.removeItem('viewedProfile');
                window.location.href = 'myweb.html';
            }
        }

        document.addEventListener('DOMContentLoaded', renderProfileData);
    </script>
</body>
</html>
