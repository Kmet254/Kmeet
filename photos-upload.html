<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set Up Your Profile - Kmeet</title>
    
    <!-- Google Fonts: Poppins & Playfair Display -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;1,400&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <!-- Font Awesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #121016;
            color: #ffffff;
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            
            /* Page Fade-In */
            animation: fadeIn 0.5s ease-out forwards;
        }

        body.fade-out {
            opacity: 0;
            transform: translateY(-8px);
            transition: opacity 0.4s ease-in-out, transform 0.4s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .onboarding-container {
            width: 100%;
            max-width: 420px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Progress Bar (3rd step active) */
        .top-bar {
            width: 100%;
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 32px;
        }

        .back-btn {
            color: #a09a9f;
            font-size: 16px;
            text-decoration: none;
            transition: color 0.2s;
        }

        .back-btn:hover {
            color: #ffffff;
        }

        .progress-bar-container {
            display: flex;
            gap: 6px;
            flex: 1;
        }

        .progress-step {
            height: 4px;
            flex: 1;
            background-color: rgba(255, 255, 255, 0.15);
            border-radius: 4px;
        }

        .progress-step.completed,
        .progress-step.active {
            background-color: #e07a5f;
        }

        /* Header */
        .onboarding-header {
            text-align: center;
            margin-bottom: 28px;
        }

        .onboarding-header h1 {
            font-family: 'Playfair Display', serif;
            font-size: 28px;
            font-weight: 500;
            color: #fceee9;
            margin-bottom: 8px;
        }

        .onboarding-header p {
            font-size: 13px;
            color: #a09a9f;
            line-height: 1.5;
            font-weight: 300;
        }

        /* Profile Photo Upload Box */
        .photo-upload-area {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            margin-bottom: 30px;
        }

        .avatar-preview-wrapper {
            position: relative;
            width: 130px;
            height: 130px;
            border-radius: 50%;
            border: 2px dashed rgba(224, 122, 95, 0.6);
            padding: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.03);
            cursor: pointer;
            transition: border-color 0.3s ease;
        }

        .avatar-preview-wrapper:hover {
            border-color: #e07a5f;
        }

        .avatar-img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            display: none;
        }

        .avatar-placeholder {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            color: #b5adb5;
        }

        .avatar-placeholder i {
            font-size: 32px;
            color: #e07a5f;
        }

        .avatar-placeholder span {
            font-size: 11px;
        }

        #fileInput {
            display: none;
        }

        /* Quick Preset Avatars */
        .preset-title {
            font-size: 12px;
            color: #837a82;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .preset-grid {
            display: flex;
            gap: 12px;
            justify-content: center;
        }

        .preset-avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.1);
            cursor: pointer;
            transition: transform 0.2s, border-color 0.2s;
            object-fit: cover;
        }

        .preset-avatar:hover,
        .preset-avatar.selected {
            border-color: #e07a5f;
            transform: scale(1.1);
        }

        /* Action Buttons */
        .footer-action {
            width: 100%;
        }

        .btn-continue {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 25px;
            background-color: #e07a5f;
            color: #ffffff;
            font-size: 14px;
            font-weight: 500;
            font-family: 'Poppins', sans-serif;
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.15s ease;
        }

        .btn-continue:hover {
            background-color: #d0694e;
            transform: translateY(-1px);
        }
    </style>
</head>
<body>

    <main class="onboarding-container">
        
        <!-- Progress Bar (Step 3) -->
        <div class="top-bar">
            <a href="onboarding.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i></a>
            
            <div class="progress-bar-container">
                <div class="progress-step completed"></div>
                <div class="progress-step completed"></div>
                <div class="progress-step active"></div>
                <div class="progress-step"></div>
                <div class="progress-step"></div>
            </div>
        </div>

        <!-- Header -->
        <div class="onboarding-header">
            <h1>Add your photo</h1>
            <p>Upload a profile picture or choose an avatar to start making intentional connections.</p>
        </div>

        <!-- Photo Selection Area -->
        <div class="photo-upload-area">
            
            <!-- Clickable Custom Upload Box -->
            <label for="fileInput" class="avatar-preview-wrapper" id="uploadWrapper">
                <img id="avatarPreview" class="avatar-img" src="" alt="Profile Preview">
                <div id="avatarPlaceholder" class="avatar-placeholder">
                    <i class="fa-solid fa-camera"></i>
                    <span>Upload Photo</span>
                </div>
            </label>
            <input type="file" id="fileInput" accept="image/*">

            <!-- Alternative Quick Preset Avatars -->
            <span class="preset-title">Or pick a starter avatar</span>
            <div class="preset-grid">
                <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150&auto=format&fit=crop&q=80" class="preset-avatar" data-src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=300&auto=format&fit=crop&q=80" alt="Preset 1">
                <img src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=150&auto=format&fit=crop&q=80" class="preset-avatar" data-src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=300&auto=format&fit=crop&q=80" alt="Preset 2">
                <img src="https://images.unsplash.com/photo-1517841905240-472988babdf9?w=150&auto=format&fit=crop&q=80" class="preset-avatar" data-src="https://images.unsplash.com/photo-1517841905240-472988babdf9?w=300&auto=format&fit=crop&q=80" alt="Preset 3">
            </div>

        </div>

        <!-- Finish Onboarding Button -->
        <div class="footer-action">
            <button id="finishBtn" type="button" class="btn-continue">Complete Profile</button>
        </div>

    </main>

    <script>
        const fileInput = document.getElementById('fileInput');
        const avatarPreview = document.getElementById('avatarPreview');
        const avatarPlaceholder = document.getElementById('avatarPlaceholder');
        const presets = document.querySelectorAll('.preset-avatar');
        const finishBtn = document.getElementById('finishBtn');

        let selectedPhotoData = '';

        // Handle Custom Local File Upload
        fileInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    selectedPhotoData = event.target.result;
                    avatarPreview.src = selectedPhotoData;
                    avatarPreview.style.display = 'block';
                    avatarPlaceholder.style.display = 'none';

                    // Clear preset selection highlights
                    presets.forEach(p => p.classList.remove('selected'));
                };
                reader.readAsDataURL(file);
            }
        });

        // Handle Preset Avatar Clicks
        presets.forEach(preset => {
            preset.addEventListener('click', function() {
                presets.forEach(p => p.classList.remove('selected'));
                this.classList.add('selected');

                selectedPhotoData = this.getAttribute('data-src');
                avatarPreview.src = selectedPhotoData;
                avatarPreview.style.display = 'block';
                avatarPlaceholder.style.display = 'none';
            });
        });

        // Redirect directly to profile.html
        finishBtn.addEventListener('click', function() {
            if (!selectedPhotoData) {
                // Default fallback image if user clicks finish without choosing
                selectedPhotoData = 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=300&auto=format&fit=crop&q=80';
            }

            // Save image path or Base64 data string to localStorage
            localStorage.setItem('userAvatar', selectedPhotoData);

            document.body.classList.add('fade-out');

            // Navigate to profile dashboard page
            setTimeout(function() {
                window.location.href = 'profile.html';
            }, 400);
        });
    </script>

</body>
</html>
