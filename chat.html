<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kmeet - Secure Courtship Chat</title>

    <!-- Browser Tab Icon (Favicon) -->
    <link rel="icon" type="image/png" href="/heart.png.png">
    <base target="_self">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;1,400&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: #0d0b0e;
            color: #ffffff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            background: linear-gradient(rgba(13, 11, 14, 0.55), rgba(4, 9, 30, 0.75)), url('img/bg34.jpg') no-repeat center center fixed;
            background-size: cover;
            overflow: hidden;
        }

        /* Top Navigation */
        .main-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            padding: 16px 24px;
            background: rgba(13, 11, 14, 0.8);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .logo img {
            max-height: 40px;
            width: auto;
            object-fit: contain;
            display: block;
        }

        .nav-links ul {
            display: flex;
            list-style: none;
            gap: 20px;
            align-items: center;
        }

        .nav-links ul li a {
            color: #ffffff;
            text-decoration: none;
            font-size: 13px;
            letter-spacing: 1px;
            transition: color 0.2s ease;
        }

        .nav-links a:hover {
            color: #e07a5f;
        }

        /* Chat Layout Container */
        .chat-container {
            flex: 1;
            max-width: 800px;
            width: 100%;
            margin: 20px auto;
            display: flex;
            flex-direction: column;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            overflow: hidden;
            padding: 20px;
        }

        .chat-header {
            padding-bottom: 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .chat-header h2 {
            font-size: 18px;
            color: #fceee9;
        }

        .chat-header span {
            font-size: 12px;
            color: #2ecc71;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* Messages Area */
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .message {
            max-width: 70%;
            padding: 12px 16px;
            border-radius: 14px;
            font-size: 13px;
            line-height: 1.4;
        }

        .message.incoming {
            background: rgba(255, 255, 255, 0.1);
            color: #ffffff;
            align-self: flex-start;
            border-bottom-left-radius: 2px;
        }

        .message.outgoing {
            background: #e07a5f;
            color: #ffffff;
            align-self: flex-end;
            border-bottom-right-radius: 2px;
        }

        /* Chat Input Area */
        .chat-input-form {
            display: flex;
            gap: 10px;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .chat-input-form input {
            flex: 1;
            padding: 12px 16px;
            border-radius: 25px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(0, 0, 0, 0.3);
            color: #ffffff;
            font-size: 13px;
            outline: none;
        }

        .chat-input-form input:focus {
            border-color: #e07a5f;
        }

        .btn-send {
            padding: 0 20px;
            border: none;
            border-radius: 25px;
            background-color: #e07a5f;
            color: #ffffff;
            font-size: 14px;
            cursor: pointer;
            transition: background 0.3s ease;
        }

        .btn-send:hover {
            background-color: #d0694e;
        }
    </style>
</head>
<body>

    <!-- Navigation Header -->
    <nav class="main-nav">
        <div class="logo">
            <a href="myweb.html">
                <img src="/Kmeet.jpg_2.jfif" alt="Kmeet Logo">
            </a>
        </div>
        <div class="nav-links">
            <ul>
                <li><a href="discover.html">DISCOVER</a></li>
                <li><a href="profile.html">PROFILE</a></li>
                <li><a href="myweb.html">HOME</a></li>
            </ul>
        </div>
    </nav>

    <!-- Main Chat Workspace -->
    <div class="chat-container">
        <div class="chat-header">
            <h2>Intentional Connection Chat</h2>
            <span><i class="fa-solid fa-circle" style="font-size: 8px;"></i> Active Secure Session</span>
        </div>

        <div class="chat-messages" id="chatMessages">
            <div class="message incoming">
                Hello! Welcome to your secure messaging channel. Your subscription is active, and you can now connect intentionally.
            </div>
        </div>

        <form id="chatForm" class="chat-input-form">
            <input type="text" id="messageInput" placeholder="Type a message..." required autocomplete="off">
            <button type="submit" class="btn-send"><i class="fa-solid fa-paper-plane"></i></button>
        </form>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // 1. Verify Authentication and Payment State
            const isLoggedIn = localStorage.getItem('isLoggedIn');
            const isPaid = localStorage.getItem('isPaid');

            if (isLoggedIn !== 'true') {
                window.location.href = 'login.html';
                return;
            }

            if (isPaid !== 'true') {
                alert("Subscription required to access the chat channel.");
                window.location.href = 'myweb.html'; // Redirect back or to payment flow
                return;
            }

            // 2. Handle Message Simulation / Sending
            const chatForm = document.getElementById('chatForm');
            const messageInput = document.getElementById('messageInput');
            const chatMessages = document.getElementById('chatMessages');

            chatForm.addEventListener('submit', function(e) {
                e.preventDefault();
                const text = messageInput.value.trim();
                if (!text) return;

                // Append outgoing message
                const msgDiv = document.createElement('div');
                msgDiv.className = 'message outgoing';
                msgDiv.textContent = text;
                chatMessages.appendChild(msgDiv);

                messageInput.value = '';
                chatMessages.scrollTop = chatMessages.scrollHeight;

                // Simulate a polite automated echo response for demo purposes
                setTimeout(() => {
                    const replyDiv = document.createElement('div');
                    replyDiv.className = 'message incoming';
                    replyDiv.textContent = "Message received securely. Thank you for using Kmeet!";
                    chatMessages.appendChild(replyDiv);
                    chatMessages.scrollTop = chatMessages.scrollHeight;
                }, 1000);
            });
        });
    </script>
</body>
</html>
